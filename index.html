    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Patrick+Hand&display=swap');
      html {
        font-size: 90%;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        overflow-x: hidden; /* Prevent scroll from blobs */
      }
      
      /* Dark mode body */
      .dark body {
        background-color: #0f172a;
        color: #f8fafc;
      }

      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      /* Animations */
      @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      .animate-blob {
        animation: blob 7s infinite;
      }
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      .animation-delay-4000 {
        animation-delay: 4s;
      }
      
      /* Pulse border */
      @keyframes pulse-border {
        0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
        100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
      }
      .pulse-ring {
        animation: pulse-border 2s infinite;
      }

      /* Glass Utility */
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      .dark .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .glass-nav {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(229, 231, 235, 0.5);
      }
      
      .dark .glass-nav {
        background: rgba(15, 23, 42, 0.85);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      /* 3D Transform utility */
      .transform-style-3d {
        transform-style: preserve-3d;
      }

      /* Range Slider Styling */
      input[type=range].range-slider {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range].range-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 24px;
        width: 24px;
        border-radius: 50%;
        background: #4f46e5;
        cursor: pointer;
        margin-top: -8px; 
        box-shadow: 0 0 2px 0 rgba(0,0,0,0.2);
        transition: transform 0.1s;
      }
      input[type=range].range-slider::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }
      input[type=range].range-slider::-webkit-slider-runnable-track {
        width: 100%;
        height: 8px;
        cursor: pointer;
        background: #e5e7eb;
        border-radius: 4px;
      }
      .dark input[type=range].range-slider::-webkit-slider-runnable-track {
        background: #334155;
      }

      /* Animated Arrow */
      .animate-draw-arrow {
        stroke-dasharray: 20;
        stroke-dashoffset: 20;
        animation: drawArrow 2s ease-in-out infinite;
      }
      
      @keyframes drawArrow {
        0% { stroke-dashoffset: 20; opacity: 0; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
    </style>
